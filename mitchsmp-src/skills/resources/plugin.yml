name: MitchSMP-Skills
version: 0.1.0
api-version: '26.1'
main: nl.mitchsmp.skills.SkillsPlugin
author: Mitchel
description: Skilltree, endgame tool abilities and mechanics guide for MitchSMP.
depend:
  - MitchSMP-Core
commands:
  skills:
    aliases: [skilltree, sk]
    description: Open the MitchSMP skilltree.
    usage: /skills [admin]
  skillsadmin:
    aliases: [skilladmin, skadmin]
    description: Admin tooling for the Bloodbound skilltree.
    usage: /skillsadmin <addxp|givepoint|points|reset|unlock|setbranch|clearbranch|debug|testgui|reload> ...
  anvil:
    aliases: [portableanvil]
    description: Open the Runesmith Arcane Workstation anvil if unlocked.
    usage: /anvil
  enchant:
    aliases: [enchanting, portableenchant]
    description: Open the Runesmith Arcane Workstation enchanting table if unlocked.
    usage: /enchant
  abilities:
    aliases: [ability, enchants]
    description: Open tool-bound endgame ability menu.
    usage: /abilities [clean|config]
  mechanics:
    aliases: [guide, mguide]
    description: Get the MitchSMP mechanics guide.
    usage: /mechanics
  scout:
    description: Active combat scouting ability.
    usage: /scout
  markvein:
    description: Active mining prospector ability.
    usage: /markvein
  bloodrush:
    description: Active duelist combat ability.
    usage: /bloodrush
  brewboost:
    description: Active alchemy brewing ability.
    usage: /brewboost
  contractboost:
    description: Active economy contract ability.
    usage: /contractboost
permissions:
  mitchsmp.skills.use:
    default: true
  mitchsmp.skills.reset:
    default: true
  mitchsmp.skills.anvil:
    default: true
  mitchsmp.skills.enchant:
    default: true
  mitchsmp.skills.admin:
    default: op
  mitchsmp.skills.debug:
    default: op
