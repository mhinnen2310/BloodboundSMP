name: MitchSMP-Core
version: 0.1.0
api-version: '26.1'
main: nl.mitchsmp.core.MitchSMPCore
author: Mitchel
description: Core API and services for all MitchSMP plugins.
commands:
  mitchcore:
    description: MitchSMP core status and reload command.
    usage: /mitchcore
  features:
    description: View or change central Bloodbound feature flags.
    usage: /features [list|enable <feature>|disable <feature>]
  errors:
    description: Review captured command execution errors.
    usage: /errors [recent [count]|clear]
  maintenance:
    description: Toggle Bloodbound maintenance mode for guided testing.
    usage: /maintenance <on|off|status>
  qa:
    description: Run guided Bloodbound launch QA while maintenance is active.
    usage: /qa <start smoke|auto smoke|pass|warn|fail|next|status|stop|recent>
