name: MitchSMP-Artifacts
version: 0.1.0
api-version: '26.1'
main: nl.mitchsmp.artifacts.ArtifactsPlugin
author: Mitchel
description: Rare boss currency and OP shop for MitchSMP.
depend:
  - MitchSMP-Core
commands:
  opshop:
    aliases: [bossShop, shardshop]
    description: Open the Boss Shard shop.
    usage: /opshop [tab]
  opshopadmin:
    aliases: [bossShopAdmin, shardshopadmin]
    description: Configure the Boss Shard shop tabs and slots.
    usage: /opshopadmin <tab|set|remove|reload|list>
  bossshards:
    aliases: [shards]
    description: Admin Boss Shard command.
    usage: /bossshards give <player> [amount]
  shardatm:
    description: Give a physical Shard ATM block.
    usage: /shardatm [player] [amount]
  shardvault:
    description: Give a placeable Shard Vault block.
    usage: /shardvault [player] [amount]
permissions:
  mitchsmp.artifacts.use:
    description: Use the Boss Shard shop.
    default: true
  mitchsmp.artifacts.admin:
    description: Manage Boss Shards, OP shop, Shard ATMs and Shard Vaults.
    default: op
